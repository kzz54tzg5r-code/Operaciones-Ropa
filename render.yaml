services:
  - type: web
    name: operaciones-ropa
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: OPERACIONES_ROPA_DATA
        value: /var/data/operaciones-ropa
      - key: OPERACIONES_ROPA_HTTPS_ONLY
        value: "1"
      - key: OPERACIONES_ROPA_SESSION_SECRET
        generateValue: true
    disk:
      name: operaciones-ropa-data
      mountPath: /var/data
      sizeGB: 1
