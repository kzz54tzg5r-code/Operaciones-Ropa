<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123B73">
  <title>Operaciones Ropa · Sin conexión</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fa;color:#123b73}
    body{display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
    .card{width:min(420px,100%);background:#fff;border:1px solid #dce4ee;border-radius:22px;padding:28px;box-shadow:0 16px 48px rgba(18,59,115,.12);text-align:center}
    .icon{width:76px;height:76px;margin:0 auto 18px;border-radius:20px;background:#123b73;color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;box-shadow:inset -16px 0 #e4007f}
    h1{font-size:22px;margin:0 0 10px}p{color:#667085;line-height:1.45;margin:0 0 18px}
    button{width:100%;border:0;border-radius:12px;background:#1769e8;color:#fff;padding:13px 16px;font-weight:800;font-size:15px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">R</div>
    <h1>Sin conexión</h1>
    <p>Operaciones Ropa necesita conexión para consultar y actualizar los datos. Tus respuestas de API no se guardan en caché.</p>
    <button onclick="location.reload()">Volver a intentar</button>
  </main>
</body>
</html>
