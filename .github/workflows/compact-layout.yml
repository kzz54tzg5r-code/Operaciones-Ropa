name: Compact report visual layout
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'v229_mobile_tabs_final_patch.py'
      - 'v234_exact_mobile_tabs_patch.py'
      - 'v237_final_ui_patch.py'
      - 'v238_responsive_nav_patch.py'
      - 'v250_option9b_filters_patch.py'
      - 'v313_bonus_visual_and_cut_patch.py'
      - 'tests/ui/compact*'
      - '.github/workflows/compact-layout.yml'
  workflow_dispatch:
concurrency:
  group: compact-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements_web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements_web.txt httpx
      - run: npm install --no-audit --no-fund
        working-directory: tests/ui
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
        working-directory: tests/ui
      - run: node tests/ui/compact-layout.browser.cjs
        env:
          ROPA_UI_OUTPUT: ui-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-layout-screens
          path: ui-artifacts/
          if-no-files-found: ignore
