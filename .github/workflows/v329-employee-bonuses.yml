name: V330 Real Indicators (Bonos 3-6)
on:
  push:
    branches: [main]
    paths:
      - "v330_bonus_indicators_patch.py"
      - "v313_bonus_visual_and_cut_patch.py"
      - "server_entry.py"
      - "tests/test_v330_bonus_indicators.py"
      - ".github/workflows/v329-employee-bonuses.yml"
  workflow_dispatch:

jobs:
  indicators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime for tests
        run: python -m pip install --disable-pip-version-check fastapi pytest
      - name: Compile backend and shell
        run: python -m py_compile v330_bonus_indicators_patch.py v313_bonus_visual_and_cut_patch.py server_entry.py
      - name: Unit tests of data and evaluation
        run: python -m pytest -q tests/test_v330_bonus_indicators.py
      - name: Verify embedded UI JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          ui=Path("v313_bonus_visual_and_cut_patch.py").read_text(encoding="utf-8")
          match=re.search(r"js\s*=\s*r'''<script id=\"v313-js\">([\s\S]*?)</script>'''",ui)
          assert match, "Embedded JavaScript not found"
          Path("/tmp/v330-bonuses.js").write_text(match.group(1),encoding="utf-8")
          assert '/api/bonuses-v330?' in match.group(1)
          assert 'v330Visual' in match.group(1)
          assert 'Boceto 3.2' in match.group(1)
          assert 'Boceto 4.1' in match.group(1)
          assert 'Boceto 5.2' in match.group(1)
          assert 'Boceto 6.1' in match.group(1)
          assert 'v329Calc' not in match.group(1)
          assert 'v329Visual' not in match.group(1)
          print('V330 visual verification PASS')
          PY
          node --check /tmp/v330-bonuses.js
      - name: Verify unchanged Boni 1/2 and no previous simulator active
        run: |
          python - <<'PY'
          from pathlib import Path
          entry=Path("server_entry.py").read_text(encoding="utf-8")
          legacy=Path("v293_sales_bonus_patch.py").read_text(encoding="utf-8")
          bonus2=Path("v327_bonus2_zero_sales_patch.py").read_text(encoding="utf-8")
          ui=Path("v313_bonus_visual_and_cut_patch.py").read_text(encoding="utf-8")
          assert '_install_v293_sales_bonus_patch(web_app)' in entry
          assert '_install_v327_bonus2_zero_sales_patch(web_app)' in entry
          assert '_install_v330_bonus_indicators_patch(web_app)' in entry
          assert '_install_v329_employee_bonus_models_patch(web_app)' not in entry
          assert '/api/bonuses-b2-v327?' in ui
          assert 'sales_bonus_v293' in legacy
          assert '/api/bonuses-b2-v327' in bonus2
          print('Legacy Bonos 1, 2 preserved; simulator uninstalled')
          PY
