name: Confirmar Railway y Netlify en misma versión

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: confirmar-produccion-main
  cancel-in-progress: true

jobs:
  compare-deployed-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Esperar ambos despliegues y comprobar misma versión
        env:
          EXPECTED_SHA: ${{ github.sha }}
          NETLIFY_URL: https://stellular-salamander-5b2f01.netlify.app
          RAILWAY_URL: https://operaciones-ropa-production.up.railway.app
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ["EXPECTED_SHA"].lower()
          netlify = os.environ["NETLIFY_URL"]
          railway = os.environ["RAILWAY_URL"]
          deadline = time.monotonic() + 16*60

          def read_json(url):
              req = urllib.request.Request(
                  url + ("&" if "?" in url else "?") + "check=" + str(time.time_ns()),
                  headers={"Cache-Control": "no-cache", "User-Agent": "OperacionesRopa-ReleaseParity/1.0"})
              with urllib.request.urlopen(req, timeout=12) as resp:
                  if resp.status != 200:
                      raise RuntimeError(f"HTTP {resp.status}")
                  body = resp.read(8192)
                  return json.loads(body.decode("utf-8"))

          while time.monotonic() < deadline:
              results = {}
              for key,url in (
                  ("netlify", netlify + "/deploy-version.json"),
                  ("railway", railway + "/api/deploy-version"),
                  ("proxy", netlify + "/api/deploy-version"),
                  ("netlify_health", netlify + "/health"),
                  ("railway_health", railway + "/health"),
              ):
                  try:
                      results[key] = read_json(url)
                  except Exception as exc:
                      results[key] = {"error": f"{type(exc).__name__}: {str(exc)[:90]}"}

              sha_n = str(results["netlify"].get("sha", "")).lower()
              sha_r = str(results["railway"].get("sha", "")).lower()
              sha_p = str(results["proxy"].get("sha", "")).lower()
              ready = (
                  sha_n == expected and sha_r == expected and sha_p == expected
                  and results["netlify_health"].get("ok") is True
                  and results["railway_health"].get("ok") is True
              )
              print(
                  f"Esperado {expected[:12]} | Netlify {sha_n[:12] or results['netlify'].get('error', 'n/a')} | "
                  f"Railway {sha_r[:12] or results['railway'].get('error', 'n/a')} | "
                  f"Proxy {sha_p[:12] or results['proxy'].get('error', 'n/a')} | "
                  f"Health {results['netlify_health'].get('ok')}/{results['railway_health'].get('ok')}",
                  flush=True
              )
              if ready:
                  print(f"APROBADO: Railway, Netlify y GitHub main sirven el mismo commit {expected}.")
                  break
              time.sleep(25)
          else:
              raise SystemExit(
                  f"FALLÓ: después del periodo de despliegue Railway y Netlify "
                  f"no coinciden con main ({expected}). Revisar estado en ambas plataformas."
              )
          PY
