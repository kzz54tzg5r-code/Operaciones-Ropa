name: V413 Centro Operativo miniatura móvil
on:
  pull_request:
    paths:
      - "web/centro_movil_paridad_v413.css"
      - "web/index.html"
      - "web/service-worker.js"
      - "tests/test_v413_mobile_center.py"
      - ".github/workflows/v413-mobile-center.yml"
  push:
    branches: [main]
    paths:
      - "web/centro_movil_paridad_v413.css"
      - "web/index.html"
      - "web/service-worker.js"
      - "tests/test_v413_mobile_center.py"
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate safe-area, cards and scroll container
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v413_mobile_center.py tests/test_v410_approved_designs.py
      - name: Check no missing stylesheet
        run: |
          test -s web/centro_movil_paridad_v413.css
          grep -q "centro_movil_paridad_v413.css?v=413" web/index.html
          grep -q "operaciones-ropa-runtime-safe-update-v417" web/service-worker.js
