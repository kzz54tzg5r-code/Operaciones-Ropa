name: V320 Bonus Cuts, Design and Methods Smoke
on:
  push:
    branches: [main]
    paths:
      - "v293_sales_bonus_patch.py"
      - "v302_six_sales_bonuses_patch.py"
      - "v313_bonus_visual_and_cut_patch.py"
      - "server_entry.py"
      - ".github/workflows/v313-bonus-visual-cut-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile v293_sales_bonus_patch.py v302_six_sales_bonuses_patch.py v313_bonus_visual_and_cut_patch.py server_entry.py
      - name: Verify business rules and design markers
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path("v293_sales_bonus_patch.py").read_text(encoding="utf-8")
          b=Path("v313_bonus_visual_and_cut_patch.py").read_text(encoding="utf-8")
          c=Path("v302_six_sales_bonuses_patch.py").read_text(encoding="utf-8")
          assert "último disponible al iniciar el mes" not in a
          assert "opening_date <= x[0] <= limit" in a
          assert "Elige el corte de Capacidades más cercano al primer día del periodo" in a
          assert "(month_start - x[0]).days <= 7" in a
          assert "source_date=? AND source_entry_id=? AND store IN" in a
          assert "current_display_entry" in a
          assert "V318-BONUS-CUTS-AND-DESIGN" in b
          assert "source_entry_id" in a
          assert "opening_capacity_id" in a
          assert "current_capacity_id" in a
          assert "Desempeño por Tienda" in b
          assert "Colaboradores" in b
          assert "Detalle por rubro" in b
          assert "Preparando la cartera inicial" in b
          assert "S.refreshCount<10" in b
          assert "Matriz integral · diseño aprobado" in b
          assert "Escalones de reducción DDI" in b
          assert "Se requieren 2 de 3" in b
          assert "Mejora contra sí misma" in b
          assert "4 cortes semanales consecutivos" in b
          assert "sin gráficas de línea" in b.lower()
          assert "source_dates" in b
          assert 'results.append(round(num(_r.get("points")),2))' in c
          assert "len(set(results[1:]))>=4" in c
          print("V320 assertions OK")
          PY
