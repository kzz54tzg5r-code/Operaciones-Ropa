name: V414 paridad visual sin solapes
on:
  pull_request:
    paths:
      - "web/designs_25_approved_v410.css"
      - "tests/test_v414_capture_visual_contract.py"
      - ".github/workflows/v414-visual-contract.yml"
  push:
    branches: [main]
    paths:
      - "web/designs_25_approved_v410.css"
      - "tests/test_v414_capture_visual_contract.py"
jobs:
  capture-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V241 layout, 25 approved targets and navigation
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v414_capture_visual_contract.py tests/test_v412_design_parity.py tests/test_v410_approved_designs.py
          node --check web/designs_25_approved_v410.js
