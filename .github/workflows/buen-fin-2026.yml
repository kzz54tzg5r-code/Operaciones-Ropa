name: Buen Fin 2026 · validación
on:
  pull_request:
    paths:
      - "buen_fin_module.py"
      - "web/buen_fin.html"
      - "tests/test_buen_fin_module.py"
      - ".github/workflows/buen-fin-2026.yml"
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -q pytest fastapi python-multipart pandas
      - run: python -m pytest -q tests/test_buen_fin_module.py
      - name: Sintaxis Python + JS y referencia foto macro
        run: |
          python -m py_compile buen_fin_module.py server_entry.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/buen_fin.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/buen_fin_ui.js').write_text(scripts[0])
          assert '/api/bonuses/product-photo/' in s
          assert '/static/ac_scanner.js' in s
          assert 'buenFinSidebarLink' in Path('web/index.html').read_text()
          PY
          node --check /tmp/buen_fin_ui.js
