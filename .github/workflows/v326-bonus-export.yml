name: V326 Bonus Export XLSX PDF Smoke
on:
  push:
    branches: [main]
    paths:
      - "v322_bonus_model_exports.py"
      - "tests/test_bonus_export_formats.py"
      - ".github/workflows/v326-bonus-export.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install export dependencies
        run: python -m pip install --disable-pip-version-check fastapi pytest openpyxl reportlab pillow
      - name: Validate binary downloads and catalog filters
        run: python -m pytest -q tests/test_bonus_export_formats.py
