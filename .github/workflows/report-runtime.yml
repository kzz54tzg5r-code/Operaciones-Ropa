name: Report runtime regression

on:
  push:
    branches: [main]
    paths: ["web/**", "v*.py", "daily_sales_headers.py", "tests/test_v376_daily_sales_headers.py", "tests/test_v378_excel_monthly_integration.py", ".github/workflows/report-runtime.yml", "!v313_bonus_visual_and_cut_patch.py", "!v321_bonus_initial_upload_responsive_patch.py", "server_entry.py", "web_app.py", "!web_app.py", "tests/ui/**", "tests/test_v331_recovery_audit.py"]
  pull_request:
    paths: ["web/**", "v*.py", "daily_sales_headers.py", "tests/test_v376_daily_sales_headers.py", "tests/test_v378_excel_monthly_integration.py", ".github/workflows/report-runtime.yml", "!v313_bonus_visual_and_cut_patch.py", "!v321_bonus_initial_upload_responsive_patch.py", "server_entry.py", "web_app.py", "!web_app.py", "tests/ui/**"]
  workflow_dispatch:

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Install production runtime and browser test dependencies
        run: |
          python -m pip install -r requirements_web.txt httpx==0.28.1
          npm --prefix tests/ui ci
      - name: Validate recovery audit SQL, store scoping and quality rules
        run: python -m pytest -q tests/test_v331_recovery_audit.py
      - name: Validate compact capture, timers and preserved Inicio/Fin controls
        run: python -m pytest -q tests/test_v377_compact_cm_capture.py
      - name: Validate PDF day/week/month, logo and monetary display
        run: python -m pytest -q tests/test_v366_pdf_visual_parity.py tests/test_v367_recovery_source.py tests/test_v368_rebuild_dev.py tests/test_v369_daily_recovery_ui.py tests/test_v370_monthly_store_guard.py
      - name: Validate FIFO DEV scopes and pending calculations
        run: python -m pytest -q tests/test_v372_dev_pending.py tests/test_v375_center_cards_recovery.py
      - name: Validate monthly Excel headers, all seven periods
        run: python -m pytest -q tests/test_v376_daily_sales_headers.py tests/test_v378_excel_monthly_integration.py tests/test_v381_actual_excel_headers.py tests/test_v382_monthly_shifted_layout.py
      - name: Validate Price Shoes logo in login sidebar report and PWA
        run: python -m pytest -q tests/test_v380_price_shoes_branding.py
      - name: Validate the served page, navigation, reports and filters
        run: timeout 120s npm --prefix tests/ui test
