name: Web UI syntax check

on:
  pull_request:
    paths:
      - "web/**"
      - "v*.py"
      - "server_entry.py"
      - "web_app.py"
      - "tests/ui/**"
      - ".github/workflows/web-ui-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production runtime dependencies
        run: python -m pip install -r requirements_web.txt httpx==0.28.1
      - name: Compile responsive and production entry modules
        run: |
          python -m py_compile server_entry.py v194_mobile_ui_final_patch.py v195_report_navigation_restore_patch.py v196_android_single_finger_scroll_patch.py v286_scroll_type_authority_patch.py v289_device_fit_patch.py v321_bonus_initial_upload_responsive_patch.py v322_universal_responsive_audit_patch.py
      - name: Validate current JavaScript assets
        run: |
          node --check web/design_system.js
          node --check web/report_tab_carousel.js
          node --check web/report_tab_mundial_v7.js
          node --check web/report_tab_icon_rail_v1.js
          node --check web/pwa_install.js
          node --check web/pwa_brand.js
      - name: Render the real production middleware chain
        run: |
          mkdir -p /tmp/operaciones-ropa-ui-syntax
          python tests/ui/render_production_page.py /tmp/operaciones-ropa-ui-syntax
      - name: Parse served inline scripts and check final responsive authority
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("/tmp/operaciones-ropa-ui-syntax/page.html").read_text(encoding="utf-8")
          assert 'id="v321-bonus-responsive-css"' in html, "V321 bonus UI missing"
          assert 'id="v322-universal-responsive-css"' in html, "V322 responsive authority missing"
          assert html.index('id="v321-bonus-responsive-css"') < html.index('id="v322-universal-responsive-css"'), "V322 must be the final CSS authority"
          assert 'viewport-fit=cover' in html
          assert "touch-action: pan-x pan-y pinch-zoom !important" in html
          assert "user-scalable=no" not in html, "browser zoom must remain accessible"

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline scripts found in served production page")
          out = Path("/tmp/operaciones-ropa-inline-scripts")
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"Rendered production page and extracted {len(scripts)} inline scripts")
          PY
          for f in /tmp/operaciones-ropa-inline-scripts/*.js; do node --check "$f"; done
