name: Web UI syntax check

on:
  pull_request:
    paths:
      - "web/**"
      - "v193_sellthrough_clean_ui.py"
      - "v241_cm_capture_authoritative_patch.py"
      - ".github/workflows/web-ui-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check actual loaded assets and extract inline scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          assert 'id="operativoNav"' in html
          assert 'id="analysisNav"' in html
          assert 'id="globalFilters"' in html
          assert html.index('id="operativoNav"') < html.index('id="globalFilters"')
          assert 'viewport-fit=cover' in html
          assert 'class="monthly-cross-mobile"' in html
          assert 'TOTAL GENERAL · TOTAL PZS' in html
          assert '/static/designs_25_approved_v410.css?v=414' in html
          assert '/static/designs_25_approved_v410.js?v=410' in html
          assert '/static/correccion_visual_v411.css?v=411' in html
          assert '/static/correccion_visual_v411.js?v=411' in html
          assert html.index('/static/designs_25_approved_v410.css?v=414') < html.index('/static/correccion_visual_v411.css?v=411')
          assets=set(re.findall(r'''(?:src|href)=[\"']/static/([^\"'?]+\.(?:js|css))(?:\?[^\"']+)?[\"']''', html, flags=re.I))
          assert len(assets)>=25, f"Only {len(assets)} active resources"
          for asset in sorted(assets):
              assert (Path("web")/asset).is_file(), f"Static asset missing: {asset}"
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,flags=re.S|re.I)
          assert scripts, "Inline JS missing"
          dest=Path("/tmp/inline-scripts")
          dest.mkdir(parents=True,exist_ok=True)
          for i,script in enumerate(scripts):
              (dest/f"script-{i}.js").write_text(script,encoding="utf-8")
          for path in ("web/designs_25_approved_v410.css","web/correccion_visual_v411.css"):
              css=Path(path).read_text(encoding="utf-8")
              body=re.sub(r'/\*[\s\S]*?\*/','',css)
              assert body.count('{')==body.count('}'),f"{path}: unbalanced rules"
          print(f"Validated {len(assets)} active CSS/JS resources and {len(scripts)} inline scripts")
          PY
      - name: Parse every active and inline JavaScript file
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          html=Path("web/index.html").read_text(encoding="utf-8")
          sources=set(re.findall(r'''src=[\"']/static/([^\"'?]+\.js)(?:\?[^\"']+)?[\"']''',html,flags=re.I))
          sources={Path('web')/name for name in sources}
          sources.update(Path('/tmp/inline-scripts').glob('*.js'))
          for source in sorted(sources):
              test=subprocess.run(['node','--check',str(source)],text=True,capture_output=True,check=False)
              assert test.returncode==0, f"{source}: {test.stderr}"
          print(f"Parsed {len(sources)} JavaScript scripts successfully")
          PY
      - name: Verify current capture, filters, PWA and render contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('web/index.html').read_text(encoding='utf-8')
          nav=Path('web/navegacion_unificada_v363.js').read_text(encoding='utf-8')
          responsive=Path('web/reporte_adaptable_v407.js').read_text(encoding='utf-8')
          capture=Path('v241_cm_capture_authoritative_patch.py').read_text(encoding='utf-8')
          active=Path('web/correccion_visual_v411.js').read_text(encoding='utf-8')
          assert 'enforceTopOrder' in Path('web/design_system.js').read_text(encoding='utf-8')
          assert 'revealActive' in nav
          assert 'sizeTabs' in responsive
          assert 'alignActive' in active
          assert 'v241Start' in capture and 'v241Finish' in capture
          assert 'v241Timer' in capture and 'v241PieceCaptureHost' in capture
          assert 'id="page-accordion"' in html and 'id="page-lingerie-checklist"' in html
          assert Path('web/service-worker.js').is_file()
          print('Active user-interface contracts OK')
          PY
