name: Web UI syntax check

on:
  pull_request:
    paths:
      - "web/index.html"
      - "web/design_system.css"
      - "web/design_system.js"
      - "web/report_tab_carousel.js"
      - "v194_mobile_ui_final_patch.py"
      - "server_entry.py"
      - ".github/workflows/web-ui-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate inline JavaScript and mobile summary
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("web/index.html").read_text(encoding="utf-8")
          assert 'class="monthly-cross-mobile"' in html
          assert '.monthly-cross-desktop{display:none!important}' in html
          assert 'TOTAL GENERAL · TOTAL PZS' in html
          assert '/static/design_system.css' in html
          assert '/static/design_system.js' in html

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          out = Path("/tmp/inline-scripts")
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline scripts")
          PY
          for f in /tmp/inline-scripts/*.js; do node --check "$f"; done
          node --check web/design_system.js
          node --check web/report_tab_carousel.js
          python - <<'PY'
          from pathlib import Path
          js = Path("web/design_system.js").read_text(encoding="utf-8")
          assert "characterData:true" not in js, "Safari DOM loop guard: characterData observer remains"
          assert "attributeFilter:['class']" not in js, "Safari DOM loop guard: class observer remains"
          assert "if (out.textContent !== next)" in js, "Safari DOM loop guard missing idempotent summary"
          print("Safari DOM loop guard OK")
          PY
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          css = Path("web/design_system.css").read_text(encoding="utf-8")
          js = Path("web/design_system.js").read_text(encoding="utf-8")
          assert 'design_system.css?v=20260928-mobile-v5' in html
          assert 'design_system.js?v=20260928-mobile-v5' in html
          assert html.index('id="operativoNav"') < html.index('id="globalFilters"'), "Tabs must precede global filters"
          assert "MOBILE EXPERIENCE V4" in css
          assert "const enforceTopOrder = () =>" in js
          print("Mobile V4 layout guard OK")
          PY
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          js = Path("web/design_system.js").read_text(encoding="utf-8")
          patch = Path("v194_mobile_ui_final_patch.py").read_text(encoding="utf-8")
          entry = Path("server_entry.py").read_text(encoding="utf-8")
          compile(patch, "v194_mobile_ui_final_patch.py", "exec")
          assert 'apple-mobile-web-app-status-bar-style" content="default"' in html
          assert 'class="or-report-filter-card"' in html
          assert 'or-tab-icon' in js
          assert "v194-mobile-ui-final-css" in patch
          assert entry.index("_install_v194_mobile_ui_final_patch(web_app)") > entry.index("_install_pwa_patch(web_app)")
          print("V194 final visual guard OK")
          PY
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          js = Path("web/report_tab_carousel.js").read_text(encoding="utf-8")
          ds = Path("web/design_system.js").read_text(encoding="utf-8")
          assert '/static/report_tab_carousel.js?v=20260928-carousel-v4' in html
          assert 'scroll-snap-type:x mandatory' in js
          assert "commercial.sellthrough" in js
          assert "data.v125Tab" in js or "dataset.v125Tab" in js
          assert "rt-carousel-arrow" in js
          assert "nearest.click()" in js
          assert "activateFirst" in js
          assert "closest('.rt-carousel-shell')" in ds
          assert "#metricSwitch" in js and "#paretoGroupSwitch" in js
          print("ReportTabCarousel guard OK")
          PY
          python - <<'PY'
          from pathlib import Path
          car = Path("web/report_tab_carousel.js").read_text(encoding="utf-8")
          v161 = Path("v161_unified_boceto_filters_cards_patch.py").read_text(encoding="utf-8")
          html = Path("web/index.html").read_text(encoding="utf-8")
          assert '/static/report_tab_carousel.js?v=20260928-carousel-v4' in html
          assert 'body[data-v163-module="operativo"] #operativoNav.rt-carousel' in car
          assert 'display:flex!important' in car
          assert 'body[data-v163-module="operativo"] #v161FilterBar' in car
          assert "mod==='cambios'" in v161
          assert "or-fixed-period" in car
          assert "'Reporte Semanal':'Semana ISO'" in car
          assert "'Reporte Mensual':'Mes'" in car
          assert "'Operación Diaria':'Fecha'" in car
          print("Single filter + carousel V2 guard OK")
          PY
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          car = Path("web/report_tab_carousel.js").read_text(encoding="utf-8")
          v163 = Path("v163_module_nav_cleanup_patch.py").read_text(encoding="utf-8")
          assert '/static/report_tab_carousel.js?v=20260928-carousel-v4' in html
          assert '<div style="margin-left:auto;display:flex;gap:5px">' not in html
          assert 'viewport.style.setProperty(\'display\',\'flex\',\'important\')' in car
          assert '#operativoNav.rt-carousel:not(.hidden)' in v163
          assert '#analysisNav.rt-carousel:not(.hidden)' in v163
          assert '.v125-tabs.rt-carousel:not(.hidden)' in v163
          assert '#operativoNav:not(.hidden):not(.rt-carousel)' in v163
          print("Carousel V3 single-row guard OK")
          PY
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          car = Path("web/report_tab_carousel.js").read_text(encoding="utf-8")
          assert '/static/report_tab_carousel.js?v=20260928-carousel-v4' in html
          assert "touch-action:pan-y pinch-zoom!important" in car
          assert "viewport.addEventListener('touchmove'" in car
          assert "{passive:false}" in car
          assert "event.preventDefault()" in car
          assert "state.touchMode='horizontal'" in car
          assert "state.suppressClickUntil" in car
          assert "scroll-snap-type','none','important'" in car
          assert "scroll-snap-type','x mandatory','important'" in car
          print("iOS touch-drag V4 guard OK")
          PY
