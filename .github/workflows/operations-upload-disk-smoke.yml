name: Render operations upload disk guard
on:
  push:
    branches: [main]
    paths:
      - "web_app.py"
      - "daily_sales_headers.py"
      - "tests/test_monthly_daily_headers.py"
      - "tests/test_operations_upload_disk_guard.py"
      - ".github/workflows/operations-upload-disk-smoke.yml"
  workflow_dispatch:

jobs:
  operations-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_web.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements_web.txt
      - name: Compile API before deployment
        run: python -m py_compile web_app.py server_entry.py
      - name: Test double uploads, disk reserve and ENOSPC cleanup
        run: python -m pytest -q tests/test_operations_upload_disk_guard.py tests/test_monthly_daily_headers.py
