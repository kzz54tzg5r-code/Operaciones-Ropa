name: Verify Cloudflare secondary pilot
on:
  push:
    branches: [prueba-cloudflare-supabase]
    paths:
      - 'cloudflare-preview/**'
      - '.github/workflows/cloudflare-preview-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
# Solo validación; este workflow NUNCA despliega ni toca producción.
