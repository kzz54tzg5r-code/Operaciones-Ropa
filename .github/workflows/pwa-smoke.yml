name: PWA smoke check

on:
  pull_request:
    paths:
      - "web/manifest.webmanifest"
      - "web/service-worker.js"
      - "web/pwa_install.js"
      - "web/pwa_brand.js"
      - "web/pwa_brand.css"
      - "web/app-logo*.svg"
      - "web/app-icon-*.svg"
      - "web/offline.html"
      - "web/index.html"
      - "pwa_patch.py"
      - "server_entry.py"
      - ".github/workflows/pwa-smoke.yml"
  workflow_dispatch:

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate PWA files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("web/manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest["name"] == "Operaciones Ropa"
          assert manifest["start_url"] == "/"
          assert manifest["scope"] == "/"
          assert manifest["display"] == "standalone"
          sizes = {i["sizes"] for i in manifest["icons"]}
          assert {"192x192", "512x512"} <= sizes

          index = Path("web/index.html").read_text(encoding="utf-8")
          assert 'rel="manifest" href="/manifest.webmanifest?v=' in index
          assert '/static/pwa_install.js?v=' in index
          assert '/static/navegacion_unificada_v363.js?v=' in index
          assert '/static/reporte_adaptable_v407.js?v=' in index
          assert '/static/designs_25_approved_v410.js?v=' in index
          assert '/static/correccion_visual_v411.js?v=' in index
          assert '/static/acordeon_jerarquico_v412.css?v=412' in index
          assert '/static/acordeon_jerarquico_v412.js?v=412' in index
          assert '/static/compact_reports.css?v=413' in index
          assert '/static/pwa_brand.js' in index
          assert '/static/pwa_brand.css' in index
          assert '/static/app-icon-maskable.svg' in Path("web/manifest.webmanifest").read_text(encoding="utf-8")
          assert 'viewport-fit=cover' in index

          sw = Path("web/service-worker.js").read_text(encoding="utf-8")
          assert "url.pathname.startsWith('/api/')" in sw
          assert "networkFirst(request" in sw
          assert "cache: 'no-store'" in sw
          assert "REFRESH_APP_SHELL" in sw
          assert "'/static/designs_25_approved_v410.css?v=414'" in sw
          assert "'/static/designs_25_approved_v410.js?v=410'" in sw
          assert "'/static/correccion_visual_v411.css?v=411'" in sw
          assert "'/static/correccion_visual_v411.js?v=411'" in sw
          assert "'/static/acordeon_jerarquico_v412.css?v=412'" in sw
          assert "'/static/acordeon_jerarquico_v412.js?v=412'" in sw
          assert "'/static/centro_movil_paridad_v413.css?v=413'" in sw
          assert '/static/centro_movil_paridad_v413.css?v=413' in index
          assert "operaciones-ropa-runtime-safe-update-v416" in sw
          assert "'/static/compact_reports.css?v=413'" in sw

          entry = Path("server_entry.py").read_text(encoding="utf-8")
          assert "_install_pwa_patch(web_app)" in entry

          patch = Path("pwa_patch.py").read_text(encoding="utf-8")
          compile(patch, "pwa_patch.py", "exec")
          assert '"/api/app-version"' in patch
          assert "RENDER_GIT_COMMIT" in patch
          pwa = Path("web/pwa_install.js").read_text(encoding="utf-8")
          assert "Nueva versión disponible" in pwa
          assert "updateViaCache: 'none'" in pwa
          assert "60000" in pwa  # versión visible: comprobar cada 60 s
          print("PWA auto-update smoke check OK")
          PY
          node --check web/pwa_install.js
          node --check web/pwa_brand.js
          node tests/ui/ac_menu_visible.cjs
          node tests/ui/ac_camera_scan.cjs
          node --check web/ac_zxing_browser_0_2_1.min.js
