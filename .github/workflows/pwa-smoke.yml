name: PWA smoke check

on:
  pull_request:
    paths:
      - "web/manifest.webmanifest"
      - "web/service-worker.js"
      - "web/pwa_install.js"
      - "web/pwa_brand.js"
      - "web/pwa_brand.css"
      - "web/app-logo*.svg"
      - "web/app-icon-*.svg"
      - "web/offline.html"
      - "web/index.html"
      - "pwa_patch.py"
      - "server_entry.py"
      - ".github/workflows/pwa-smoke.yml"
  workflow_dispatch:

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate PWA files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("web/manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest["name"] == "Operaciones Ropa"
          assert manifest["start_url"] == "/"
          assert manifest["scope"] == "/"
          assert manifest["display"] == "standalone"
          sizes = {i["sizes"] for i in manifest["icons"]}
          assert {"192x192", "512x512"} <= sizes

          index = Path("web/index.html").read_text(encoding="utf-8")
          assert 'rel="manifest" href="/manifest.webmanifest"' in index
          assert '/static/pwa_install.js?v=auto-update-v1' in index
          assert '/static/report_tab_carousel.js?v=20260928-carousel-v4' in index
          assert '/static/report_tab_mundial_v5.js?v=20260928-mundial-v5' in index
          assert '/static/pwa_brand.js' in index
          assert '/static/pwa_brand.css' in index
          assert '/static/app-icon-maskable.svg' in Path("web/manifest.webmanifest").read_text(encoding="utf-8")
          assert 'viewport-fit=cover' in index

          sw = Path("web/service-worker.js").read_text(encoding="utf-8")
          assert "url.pathname.startsWith('/api/')" in sw
          assert "networkFirst(request" in sw
          assert "cache: 'no-store'" in sw
          assert "REFRESH_APP_SHELL" in sw
          assert "'/static/report_tab_carousel.js'" in sw
          assert "'/static/report_tab_mundial_v5.js'" in sw

          entry = Path("server_entry.py").read_text(encoding="utf-8")
          assert "_install_pwa_patch(web_app)" in entry

          patch = Path("pwa_patch.py").read_text(encoding="utf-8")
          compile(patch, "pwa_patch.py", "exec")
          assert '"/api/app-version"' in patch
          assert "RENDER_GIT_COMMIT" in patch
          pwa = Path("web/pwa_install.js").read_text(encoding="utf-8")
          assert "Nueva versión disponible" in pwa
          assert "updateViaCache: 'none'" in pwa
          assert "120000" in pwa
          print("PWA auto-update smoke check OK")
          PY
          node --check web/pwa_install.js
          node --check web/pwa_brand.js
