name: V412 paridad de 25 diseños autorizados
on:
  pull_request:
    paths:
      - "web/designs_25_approved_v410.css"
      - "web/designs_25_approved_v410.js"
      - "web/correccion_visual_v411.css"
      - "web/correccion_visual_v411.js"
      - "tests/test_v412_design_parity.py"
      - "tests/ui/v412-route-parity.cjs"
      - ".github/workflows/v412-25-design-parity.yml"
  push:
    branches: [main]
    paths:
      - "web/designs_25_approved_v410.css"
      - "web/designs_25_approved_v410.js"
      - "web/correccion_visual_v411.css"
      - "web/correccion_visual_v411.js"
      - "tests/test_v412_design_parity.py"
jobs:
  component-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browserless DOM test dependencies
        run: npm --prefix tests/ui ci
      - name: Validate actual components and selected styles
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v412_design_parity.py tests/test_v410_approved_designs.py
          node --check web/designs_25_approved_v410.js
          node --check web/correccion_visual_v411.js
          node tests/ui/v412-route-parity.cjs
