name: V362 Approved Tabs and Capture
on:
  push:
    branches: [main]
    paths:
      - "v199_access_perf_productivity_patch.py"
      - "v222_operation_capture_nav_admin_patch.py"
      - "web/operaciones_aprobadas_v362.css"
      - "web/operaciones_aprobadas_v362.js"
      - "web/menu_fijo_productividad_op1_v364.css"
      - "web/index.html"
      - "web/recuperacion_visible_v373.js"
      - "web/recuperacion_visible_v373.css"
      - "web/detalle_operativo_opcion1_v365.css"
      - "web/detalle_operativo_opcion1_v365.js"
      - "tests/ui/v365-detail-operativo.cjs"
      - "tests/ui/v362-contract.cjs"
      - "tests/ui/v364-navigation-productivity.cjs"
      - ".github/workflows/v362-approved-tabs.yml"
  workflow_dispatch:
jobs:
  validated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python sources
        run: python -m py_compile v199_access_perf_productivity_patch.py v222_operation_capture_nav_admin_patch.py
      - name: Validate JavaScript and selected views
        run: |
          node --check web/operaciones_aprobadas_v362.js
          node tests/ui/v362-contract.cjs
          node tests/ui/v364-navigation-productivity.cjs
          node --check web/detalle_operativo_opcion1_v365.js
          node tests/ui/v365-detail-operativo.cjs
          node --check web/recuperacion_visible_v373.js
